name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a branch cancels its older run. Called from release.yml, every dispatch runs on its
# branch's ref (main) whatever its version, so each release run's checks keep a group of their own: a
# second version's dispatch never cancels the first's (release.yml serializes one version's runs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto # go.mod pins the patch toolchain; the go command fetches it
  NVIM_VERSION: v0.10.4 # the go-race and e2e jobs' Neovim, its cache key too

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: make web-build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error
      # The npm packages the bundle carries (web/build/bundledPackages.ts), for the notices check in the go job.
      - uses: actions/upload-artifact@v4
        with:
          name: web-packages
          path: web/.nuxt/bundled-packages.json
          if-no-files-found: error

  go:
    # The Go checks but the race tests, which run in go-race beside it.
    runs-on: ubuntu-latest
    needs: web
    # A hang still ends the job: its steps took about four minutes on main (2026-11-18), the
    # group check's race build of internal/api and its six listings a few more; 30 is above
    # every honest run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make lint
      - run: make lint-static
      # Every package of go list ./... is in exactly one of go-race's groups, every test of
      # internal/api in exactly one of its five, as go test -list answers each group's -run;
      # and the matrix below lists every group once (scripts/go_test_groups.py).
      - run: python3 scripts/go_test_groups.py check
      - run: make build-go
      - run: make check-version
      - run: python3 scripts/brand_assets.py --check
      - run: python3 -m unittest discover -s scripts -p '*_test.py'
      # THIRD_PARTY_NOTICES is current: the Go modules, the web bundle's packages and the desktop app's, read from their node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
            mobile/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - uses: actions/download-artifact@v4
        with:
          name: web-packages
          path: web/.nuxt
      - run: python3 scripts/notices.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-linux-amd64
          path: bin/conductor

  go-race:
    # `go test -race -count=1 -timeout 90m ./...` as several jobs side by side: internal/api's
    # tests dealt by name into five groups, internal/crew (with its ledger) and
    # internal/dispatch in a job each, every other package together. The same flags and bound
    # in each; scripts/go_test_groups.py makes each group's command, and the go job's check
    # fails the run when a test is in no group or in two (docs/checks.md).
    runs-on: ubuntu-latest
    needs: web
    # A hang still ends a job: its bound is the race tests' 90 m plus its other steps
    # (Neovim's download 5 among them), above the test bound, never a multiple of it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [api-1, api-2, api-3, api-4, api-5, crew, dispatch, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      # A file a check fetches is cached, and its download retried for minutes: a release
      # mirror's 504s fail nothing but the try (#281). A cached or half-written tarball that
      # is not a gzip is fetched again, never extracted.
      - uses: actions/cache@v4
        with:
          path: ~/nvim-cache
          key: nvim-${{ env.NVIM_VERSION }}-linux-x86_64
      - name: Install Neovim (the editor bridge's tests run against the real one)
        run: |
          tgz=~/nvim-cache/nvim.tar.gz
          mkdir -p ~/nvim-cache
          if tar -tzf "$tgz" >/dev/null 2>&1; then
            echo "Neovim $NVIM_VERSION from the cache"
          else
            curl -fL --no-progress-meter --retry 8 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
              -o "$tgz.part" "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
            tar -tzf "$tgz.part" >/dev/null
            mv "$tgz.part" "$tgz"
          fi
          sudo tar -C /usr/local --strip-components=1 -xzf "$tgz"
          nvim --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      # The group's tests: its command first, then go test's own output.
      - name: go test -race of the group
        env:
          GROUP: ${{ matrix.group }}
        run: python3 scripts/go_test_groups.py run "$GROUP"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - run: make vuln

  build-matrix:
    # The server runs on Linux and macOS; Windows runs the Linux binary in
    # WSL2 through the desktop app, so there is no windows row.
    runs-on: ubuntu-latest
    needs: web
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build-go
      - uses: actions/upload-artifact@v4
        with:
          name: conductor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/conductor

  e2e:
    # 22.04: Playwright 1.44.1's dependency list names libasound2, which 24.04 no longer has.
    runs-on: ubuntu-22.04
    needs: web
    # The suite in six shards side by side, `e2e (1)` to `e2e (6)`, each a Playwright run of
    # its own with its own server (docs/checks.md); the job keeps its id, so required-checks
    # still fails when any shard does. fail-fast: false lets the other shards finish, so
    # every report is kept. The bound catches a hang: the set-up steps' own caps (Neovim's
    # download 5, the mirrors' 5, the browser's packages and download 40 each: 90) and the
    # longest shard measured (66, a half of the suite, main on 2026-11-18; a sixth runs
    # well under it) are 156 together, under 160.
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      # A file a check fetches is cached, and its download retried for minutes: a release
      # mirror's 504s fail nothing but the try (#281). A cached or half-written tarball that
      # is not a gzip is fetched again, never extracted.
      - uses: actions/cache@v4
        with:
          path: ~/nvim-cache
          key: nvim-${{ env.NVIM_VERSION }}-linux-x86_64
      - name: Install Neovim (the editor bridge's tests run against the real one)
        run: |
          tgz=~/nvim-cache/nvim.tar.gz
          mkdir -p ~/nvim-cache
          if tar -tzf "$tgz" >/dev/null 2>&1; then
            echo "Neovim $NVIM_VERSION from the cache"
          else
            curl -fL --no-progress-meter --retry 8 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
              -o "$tgz.part" "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz"
            tar -tzf "$tgz.part" >/dev/null
            mv "$tgz.part" "$tgz"
          fi
          sudo tar -C /usr/local --strip-components=1 -xzf "$tgz"
          nvim --version | head -1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make build-go
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # The browser's system packages come from the runner's apt mirror list. On 2026-11-11
      # its first name, azure.archive.ubuntu.com, stopped resolving and apt waited on it for
      # every fetch until the install failed, every run's e2e job with it (#281). When the
      # first mirror's name resolves, nothing changes. When it does not, each mirror whose
      # name does not resolve is taken out for this job (comments are kept, never probed);
      # when none is left, the job uses kernel.org's Ubuntu mirror, whose indexes apt still
      # checks against the image's Ubuntu archive key. An image without the file, or with a
      # file that is not a list of addresses, changes nothing. The same steps are in
      # live.yml: keep them alike.
      - name: Take out package mirrors whose names do not resolve
        timeout-minutes: 5
        run: |
          f=/etc/apt/apt-mirrors.txt fallback=https://mirrors.edge.kernel.org/ubuntu/
          if [ ! -f "$f" ]; then echo "No $f on this image: its package sources are left as they are."; exit 0; fi
          echo "The runner's mirror list, $f:"; cat "$f"
          blank='^[[:space:]]*(#|$)'
          active=$(grep -vE "$blank" "$f" || true)
          if [ -z "$active" ] || printf '%s\n' "$active" | grep -qv '://'; then echo "$f is not a list of mirror addresses: left as it is."; exit 0; fi
          name_of() { h=${1#*://}; printf '%s' "${h%%[/[:space:]]*}"; }
          resolves() { [ -n "$1" ] && timeout 30 getent ahosts "$1" >/dev/null; }
          first=$(name_of "$(printf '%s\n' "$active" | head -n 1)")
          if resolves "$first"; then echo "The first mirror's name, $first, resolves: $f is unchanged."; exit 0; fi
          kept=$(mktemp) n=0
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ $line =~ $blank ]]; then printf '%s\n' "$line" >> "$kept"
            elif h=$(name_of "$line"); resolves "$h"; then printf '%s\n' "$line" >> "$kept"; n=$((n + 1))
            else echo "::warning::$h does not resolve: taken out of $f for this job (#281)"; fi
          done < "$f"
          if [ "$n" = 0 ]; then
            echo "::warning::no mirror of $f resolves: this job uses $fallback (#281)"
            printf '%s\tpriority:1\n' "$fallback" >> "$kept"
          fi
          sudo cp "$kept" "$f"; echo "$f now:"; cat "$f"
      # Three tries a minute apart, as the downloads above retry, each try bounded: the
      # package install runs `timeout` as root, so its TERM, and the KILL 30 s after it,
      # reach apt and dpkg under it, and the next try first finishes what a killed dpkg
      # left. Each step takes at most 3 x (600 + 30) s + 2 x 60 s = 33.5 min, under its own
      # 40 and the job's 160 (#281).
      - name: Install Chromium's system packages
        timeout-minutes: 40
        working-directory: web
        run: |
          for try in 1 2 3; do
            sudo timeout -k 30 600 "$(command -v node)" node_modules/.bin/playwright install-deps chromium && exit 0
            echo "::warning::try $try of 3 of the browser's system packages failed (#281)"
            [ "$try" = 3 ] || { sleep 60; sudo dpkg --configure -a || true; }
          done
          exit 1
      - name: Download Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        working-directory: web
        run: |
          for try in 1 2 3; do
            timeout -k 30 600 npx playwright install chromium && exit 0
            echo "::warning::try $try of 3 of the browser's download failed (#281)"
            [ "$try" = 3 ] || sleep 60
          done
          exit 1
      - run: npm run typecheck:e2e
        working-directory: web
      # Playwright shards by test group, a whole file here (fullyParallel is off), and balances
      # the shards by their counts of tests; preflight_test.py holds the matrix to the step's N.
      - run: npx playwright test --shard=${{ matrix.shard }}/6
        working-directory: web
      # One name a shard: upload-artifact@v4 refuses a second artifact of one name in a run.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  pebble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - run: make test-pebble

  desktop-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # npm caches packages, not Electron's binary: its pretest (scripts/install-electron.mjs)
      # fetches it, with retries, into this cache, keyed by the locked version (#281).
      - id: electron
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm test
        working-directory: desktop
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache

  desktop-smoke:
    # The shell against the built server, in Electron under a virtual display.
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make build-go
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - id: electron
        run: echo "version=$(node -p "require('./desktop/package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      - name: Fetch Electron's binary (retried, cached; desktop-test's comment says why)
        run: npm run pretest
        working-directory: desktop
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: xvfb-run --auto-servernum npm run test:e2e
        working-directory: desktop

  mobile-ios:
    # The phone shell's iOS app, built unsigned for the simulator and started there by its boot
    # check, and its native package's tests (docs/checks.md): the one place the app's project, its
    # plugins and the native runtime are compiled together and run. scripts/ios_project.py, in the
    # go job's scripts suite, holds the project to what it must not ship.
    # Its fetches are part of the check (AGENTS.md): the Swift packages' folder is cached on the
    # manifest's hash and their resolve tried three times (scripts/ios_boot.py), each step and the
    # job under a bound that is the sum of its steps'.
    runs-on: macos-latest
    needs: web
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make mobile-install mobile-sync
        timeout-minutes: 10
      - run: make mobile-native-test
        timeout-minutes: 15
      - uses: actions/cache@v4
        with:
          path: mobile/ios/App/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('mobile/ios/App/CapApp-SPM/Package.swift', 'mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: The Swift packages, resolved (three tries)
        run: make mobile-ios-resolve
        timeout-minutes: 17
      # The build, then the boot check (ShellBootsUnderItsPolicyTests) on a simulator booted
      # as a step of its own with its own tries (scripts/ios_boot.py).
      - run: make mobile-ios
        timeout-minutes: 80
      # A packaging's signing policy, placed where the plan says, is in the app: a second build
      # with the sample (mobile/ios/fixtures) holds its class, and the default build none.
      - name: A packaging's policy is in the app (the sample's build)
        if: ${{ !cancelled() }}
        run: make mobile-ios-policy
        timeout-minutes: 30
      - name: The resolved versions Xcode wrote
        if: always()
        run: cat mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || true

  mobile-android:
    # The phone shell's Android app, built for debugging (unsigned but for the SDK's debug key), its
    # JVM tests (the key, the store, the native HTTP call and the gates' decisions) and its boot check
    # on an emulator (docs/checks.md): the one place the app's project, its plugins and the native
    # runtime are compiled together and run. scripts/android_project.py holds the project to what it
    # must not ship, here against the native runtime's own sources too.
    # Its fetches are part of the check (AGENTS.md): Gradle's distribution and packages are cached
    # (setup-gradle) and a build that failed for a fetch is tried three times, as is the emulator's
    # system image (scripts/android_boot.py); each step and the job under a bound that is the sum of
    # its steps'.
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - run: make mobile-install mobile-sync
        timeout-minutes: 10
      # The project check, then the debug build, the JVM tests and the boot check's own build.
      - name: The Android app, its JVM tests and the boot check's build (fetches tried three times)
        run: make mobile-android
        timeout-minutes: 50
      - name: The emulator's hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The emulator's system image (three tries)
        run: make mobile-android-image
        timeout-minutes: 30
      # The boot check (ShellBootsUnderItsPolicyTest): the built app on an emulator with no provider.
      - name: The boot check on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: make mobile-android-boot
      - name: The tests' reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-reports
          path: |
            mobile/android/app/build/reports
            mobile/android/app/build/outputs/androidTest-results
          if-no-files-found: ignore

  dco:
    # Every commit of a pull request is signed off by its author
    # (CONTRIBUTING.md, Sign-off). The job runs on every event and only
    # its check step is conditional: required-checks reads a skipped job
    # as a failure, and a push to main carries GitHub's merge commits,
    # which nobody signs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/dco_check.py --base "$BASE" --head "$HEAD"

  # The one check branch protection requires: green only when every job
  # above passed. A matrix job's result is one result for all its cells
  # (go-race's eight groups, e2e's six shards): failure when one cell failed
  # and the others passed (docs/checks.md), and any result but success
  # fails this job.
  required-checks:
    if: always()
    needs: [web, go, go-race, vuln, build-matrix, e2e, pebble, desktop-test, desktop-smoke, mobile-ios, mobile-android, dco]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
