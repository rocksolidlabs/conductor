name: live

# The live tier: the real agents, with test accounts, driven by the
# Playwright live spec (web/e2e/live.spec.ts). Weekly and on demand only; the
# keys live in the `live` environment, whose reviewers approve each run. A
# row whose key is absent is skipped, not failed.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto # go.mod pins the patch toolchain; the go command fetches it

jobs:
  live:
    # 22.04, as ci.yml's e2e: Playwright 1.44.1's dependency list names libasound2, which 24.04 no longer has.
    runs-on: ubuntu-22.04
    environment: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make build
      # ci.yml's e2e job has the same two steps and says why (2026-11-11, #281): keep them alike.
      - name: Take out package mirrors whose names do not resolve
        run: |
          f=/etc/apt/apt-mirrors.txt fallback=https://mirrors.edge.kernel.org/ubuntu/
          if [ ! -f "$f" ]; then echo "No $f on this image: its package sources are left as they are."; exit 0; fi
          echo "The runner's mirror list, $f:"; cat "$f"
          kept=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              *://*) host=${line#*://}; host=${host%%[/[:space:]]*} ;;
              *) host= ;;
            esac
            if [ -z "$host" ] || timeout 30 getent ahosts "$host" >/dev/null; then
              printf '%s\n' "$line" >> "$kept"
            else
              echo "::warning::$host does not resolve: taken out of $f for this job (#281)"
            fi
          done < "$f"
          if grep -q '://' "$f" && ! grep -q '://' "$kept"; then
            echo "::warning::no mirror of $f resolves: this job uses $fallback (#281)"
            printf '%s\tpriority:1\n' "$fallback" > "$kept"
          fi
          if cmp -s "$f" "$kept"; then echo "Every mirror's name resolves: $f is unchanged."; else sudo cp "$kept" "$f"; echo "$f now:"; cat "$f"; fi
      - name: Install Chromium with its system packages
        working-directory: web
        run: |
          for try in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::try $try of 3 of the browser's install failed (#281)"
            [ "$try" = 3 ] || sleep 60
          done
          exit 1
      - name: install the agents
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
      - name: a never-trusted scratch repository
        run: |
          mkdir -p "$RUNNER_TEMP/live-repo" && cd "$RUNNER_TEMP/live-repo"
          git init -q && git config user.name live && git config user.email live@conductor.invalid
          echo "# live" > README.md && git add README.md && git commit -q -m init
      - name: the live spec
        env:
          CONDUCTOR_E2E_LIVE: '1'
          CONDUCTOR_E2E_LIVE_REPO: ${{ runner.temp }}/live-repo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: make test-live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
