name: live

# The live tier: the real agents, with test accounts, driven by the
# Playwright live spec (web/e2e/live.spec.ts). Weekly and on demand only; the
# keys live in the `live` environment, whose reviewers approve each run. A
# row whose key is absent is skipped, not failed.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto # go.mod pins the patch toolchain; the go command fetches it

jobs:
  live:
    # 22.04, as ci.yml's e2e: Playwright 1.44.1's dependency list names libasound2, which 24.04 no longer has.
    runs-on: ubuntu-22.04
    environment: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The latest patch of the go.mod line's minor: the standard library's
          # fixes (govulncheck) land in patches.
          go-version: '~1.26.0'
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make build
      # ci.yml's e2e job has the same three steps and says why (2026-11-11, #281): keep them alike.
      - name: Take out package mirrors whose names do not resolve
        timeout-minutes: 5
        run: |
          f=/etc/apt/apt-mirrors.txt fallback=https://mirrors.edge.kernel.org/ubuntu/
          if [ ! -f "$f" ]; then echo "No $f on this image: its package sources are left as they are."; exit 0; fi
          echo "The runner's mirror list, $f:"; cat "$f"
          blank='^[[:space:]]*(#|$)'
          active=$(grep -vE "$blank" "$f" || true)
          if [ -z "$active" ] || printf '%s\n' "$active" | grep -qv '://'; then echo "$f is not a list of mirror addresses: left as it is."; exit 0; fi
          name_of() { h=${1#*://}; printf '%s' "${h%%[/[:space:]]*}"; }
          resolves() { [ -n "$1" ] && timeout 30 getent ahosts "$1" >/dev/null; }
          first=$(name_of "$(printf '%s\n' "$active" | head -n 1)")
          if resolves "$first"; then echo "The first mirror's name, $first, resolves: $f is unchanged."; exit 0; fi
          kept=$(mktemp) n=0
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ $line =~ $blank ]]; then printf '%s\n' "$line" >> "$kept"
            elif h=$(name_of "$line"); resolves "$h"; then printf '%s\n' "$line" >> "$kept"; n=$((n + 1))
            else echo "::warning::$h does not resolve: taken out of $f for this job (#281)"; fi
          done < "$f"
          if [ "$n" = 0 ]; then
            echo "::warning::no mirror of $f resolves: this job uses $fallback (#281)"
            printf '%s\tpriority:1\n' "$fallback" >> "$kept"
          fi
          sudo cp "$kept" "$f"; echo "$f now:"; cat "$f"
      - name: Install Chromium's system packages
        timeout-minutes: 40
        working-directory: web
        run: |
          for try in 1 2 3; do
            sudo timeout -k 30 600 "$(command -v node)" node_modules/.bin/playwright install-deps chromium && exit 0
            echo "::warning::try $try of 3 of the browser's system packages failed (#281)"
            [ "$try" = 3 ] || { sleep 60; sudo dpkg --configure -a || true; }
          done
          exit 1
      - name: Download Chromium
        timeout-minutes: 40
        working-directory: web
        run: |
          for try in 1 2 3; do
            timeout -k 30 600 npx playwright install chromium && exit 0
            echo "::warning::try $try of 3 of the browser's download failed (#281)"
            [ "$try" = 3 ] || sleep 60
          done
          exit 1
      - name: install the agents
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex
      - name: a never-trusted scratch repository
        run: |
          mkdir -p "$RUNNER_TEMP/live-repo" && cd "$RUNNER_TEMP/live-repo"
          git init -q && git config user.name live && git config user.email live@conductor.invalid
          echo "# live" > README.md && git add README.md && git commit -q -m init
      - name: the live spec
        env:
          CONDUCTOR_E2E_LIVE: '1'
          CONDUCTOR_E2E_LIVE_REPO: ${{ runner.temp }}/live-repo
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: make test-live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
