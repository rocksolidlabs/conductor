// The packages the shipped app carries, as Gradle itself resolves them (THIRD_PARTY_NOTICES, scripts/android_notices.py): every module
// of the release variant's runtime classpath, its coordinates and version, and the licences its POM names (or its parent POM's, when
// its own names none). Written to build/reports/conductor/release-classpath.txt and printed; the committed copy
// (mobile/android/release-classpath.txt) is what the notices are made from, and CI fails when the two differ.

import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

tasks.register('conductorReleaseClasspath') {
    description = "The release variant's runtime packages with the licences their POMs name, for THIRD_PARTY_NOTICES."
    def out = layout.buildDirectory.file('reports/conductor/release-classpath.txt')
    outputs.upToDateWhen { false }
    doLast {
        def pomOf = { String group, String module, String version ->
            def result = project.dependencies.createArtifactResolutionQuery()
                .forModule(group, module, version)
                .withArtifacts(MavenModule, MavenPomArtifact)
                .execute()
            def found = null
            result.resolvedComponents.each { component ->
                component.getArtifacts(MavenPomArtifact).each { artifact ->
                    if (found == null && artifact instanceof ResolvedArtifactResult) {
                        found = artifact.file
                    }
                }
            }
            return found
        }
        def licencesOf
        licencesOf = { String group, String module, String version, int depth ->
            def file = pomOf(group, module, version)
            if (file == null) {
                return []
            }
            def pom = new groovy.xml.XmlSlurper().parse(file)
            def named = []
            pom.licenses.license.each { licence ->
                named << "${licence.name.text().trim()} <${licence.url.text().trim()}>".toString()
            }
            if (named.isEmpty() && depth < 4 && pom.parent.artifactId.text()) {
                named = licencesOf(pom.parent.groupId.text(), pom.parent.artifactId.text(), pom.parent.version.text(), depth + 1)
            }
            return named
        }
        def rows = []
        configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents.each { component ->
            def id = component.id
            if (id instanceof ModuleComponentIdentifier) {
                def named = licencesOf(id.group, id.module, id.version, 0)
                rows << "${id.group}:${id.module}:${id.version}\t${named.isEmpty() ? 'no licence named' : named.join(' | ')}".toString()
            }
        }
        rows = rows.unique().sort()
        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.text = rows.join('\n') + '\n'
        println "conductor: the release variant's runtime packages as Gradle resolves them (${rows.size()}), in ${file}:"
        rows.each { row -> println "conductor:   ${row}" }
    }
}
