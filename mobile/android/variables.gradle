// Every version the Android shell builds with, pinned (docs/plans/phone-shell.md, OSS-3; docs/dependencies.md). The first block is
// the native runtime's own template as @capacitor/cli 8.6.0 writes it (its minimum, Android 7.0, API 24, is the template's: the plan
// sets none); the plugins read the versions below it from here instead of their own defaults, so nothing the app is built from is
// chosen anywhere else.
ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // The push plugin's Firebase Cloud Messaging and the in-app browser's Custom Tabs, at the versions their 8.x releases name.
    firebaseMessagingVersion = '25.0.1'
    androidxBrowserVersion = '1.9.0'
    // The shell's own: the person's unlock (BiometricPrompt), Ed25519 for a key sealed by the keystore below Android 13, and the
    // JSON parser the JVM tests run the gates with (the version the runtime's own tests use; the phone has its own).
    androidxBiometricVersion = '1.1.0'
    bouncyCastleVersion = '1.82'
    orgJsonVersion = '20250517'
}
