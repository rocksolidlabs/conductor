<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dialog fixture</title>
    <script>
      // The spec reads the bridge's outline through the shadow roots the page makes (the bridge's is the last made).
      const roots = []
      const attach = Element.prototype.attachShadow
      Element.prototype.attachShadow = function (o) {
        const r = attach.call(this, o)
        roots.push(r)
        return r
      }
      window.outlined = () => {
        const box = roots.at(-1)?.firstElementChild
        return box?.isConnected && box.style.display === 'block' ? box.firstElementChild.textContent : 'none'
      }
      window.selecting = () => !!roots.at(-1)?.host?.isConnected
    </script>
    <!--BRIDGE-->
    <style>
      body { margin: 0; font: 16px/1.4 sans-serif; background: #fff; color: #111; }
      main { padding: 24px; }
      button { font: inherit; padding: 8px 14px; border: 1px solid #333; background: #eee; }
      #sheet { margin-top: 16px; padding: 16px; border: 1px solid #333; }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>Dialog fixture</h1>
      <button id="open" type="button">Name it</button>
    </main>
    <script>
      // The dialog and its button exist only once the person opens it.
      document.getElementById('open').addEventListener('click', () => {
        if (document.getElementById('sheet')) return
        const sheet = document.createElement('section')
        sheet.id = 'sheet'
        sheet.setAttribute('role', 'dialog')
        sheet.innerHTML = '<p>Its name</p><button id="in-sheet" type="button">Save the name</button>'
        document.getElementById('app').append(sheet)
      })
    </script>
  </body>
</html>
