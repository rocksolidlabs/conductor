<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="conductor-revision" content="__REVISION__" />
    <title>Preview fixture in motion</title>
    <script>
      // The spec reads the bridge's outline through the shadow roots the page makes (the bridge's is the last made).
      const roots = []
      const attach = Element.prototype.attachShadow
      Element.prototype.attachShadow = function (o) {
        const r = attach.call(this, o)
        roots.push(r)
        return r
      }
      window.outlined = () => {
        const box = roots.at(-1)?.firstElementChild
        return box?.isConnected && box.style.display === 'block' ? box.firstElementChild.textContent : 'none'
      }
      window.selecting = () => !!roots.at(-1)?.host?.isConnected
    </script>
    <!--BRIDGE-->
    <style>
      body { margin: 0; font: 16px/1.4 sans-serif; background: #fff; color: #111; }
      main { padding: 24px; display: flex; gap: 48px; align-items: center; }
      button { font: inherit; padding: 8px 14px; border: 1px solid #333; background: #eee; }
      /* Turns all the time: one animation, whose events come once (its start), so the page's epoch holds while its pixels move. */
      #spinner { animation: turn 600s linear infinite; }
      @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(36000deg); } }
      /* Restyled by the pointer alone: no event, no DOM change. */
      #hovered:hover { background: #c00; color: #fff; }
    </style>
  </head>
  <body>
    <main id="app">
      <button id="spinner">Spinning</button>
      <button id="hovered">Hover me</button>
      <button id="plain">Plain</button>
    </main>
  </body>
</html>
